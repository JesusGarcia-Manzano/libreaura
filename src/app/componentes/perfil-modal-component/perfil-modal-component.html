<h2 mat-dialog-title>Perfil</h2>
<mat-dialog-content class="d-flex flex-column gap-3 p-3">

  <div class="form-group">
    <label class="form-label small fw-bold">Nombre</label>
    <input class="form-control" [(ngModel)]="perfil.nombre" placeholder="Nombre completo">
  </div>

  <div class="form-group">
    <label class="form-label small fw-bold">Email</label>
    <input disabled class="form-control" [(ngModel)]="perfil.email">
  </div>

  <div class="form-group">
    <label class="form-label small fw-bold">Rol</label>
    <input disabled class="form-control" [(ngModel)]="perfil.rol">
  </div>

  <div class="form-group">
    <label class="form-label small fw-bold">Teléfono</label>
    <input class="form-control" [(ngModel)]="perfil.telefono" placeholder="Ej. 55 1234 5678">
  </div>

  <div class="form-group">
    <label class="form-label small fw-bold">Dirección</label>
    <input class="form-control" [(ngModel)]="perfil.direccion" placeholder="Calle, número, colonia">
  </div>

  <div class="form-group">
    <label class="form-label small fw-bold">Indicaciones de entrega</label>
    <textarea class="form-control" [(ngModel)]="perfil.indicaciones"
      placeholder="Referencias o instrucciones"></textarea>
  </div>

</mat-dialog-content>
<mat-dialog-actions class="p-3">
  <button class="btn btn-primary" (click)="guardarCambios()">Guardar</button>
</mat-dialog-actions>
