<div class="container containerProduct">
  <h2 class="fw-bold text-center" style="color: var(--color-rosa-fuerte);">Mis Favoritos</h2>

  <div class="row">
    @for (p of productosFavoritos(); track p.id) {
      <div class="card-item col-6 col-md-6 col-lg-3 mb-4">
        <div class="card card-product h-100" [class.out-of-stock]="p.stock <= 0">
          
          <img [src]="p.imagenes?.split(',')[0]" 
               class="card-img-top product-img" 
               style="cursor: pointer;" 
               (click)="verDetalle(p)">
          
          <div class="card-body d-flex flex-column">
            <h6 class="nameProducto text-truncate">{{ p.nombre }}</h6>
            <p class="descripcionProduct small">{{ p.descripcion }}</p>
            
            <div class="contentInfoProducto">
              <span class="priceProduct fw-bold fs-4">${{ p.precio }}<small>mxn</small></span>

              @if (p.stock <= 0) {
                <div class="alert alert-danger p-1 text-center small mb-0">AGOTADO</div>
              } @else {
                <div class="actionsContentProduct d-flex gap-2">
                  <button class="btn-icon-solo favorito" (click)="toggleFavorito(p.id)">
                    <i class="bi" 
                       [ngClass]="isFavorito(p.id) ? 'bi-heart-fill' : 'bi-heart'"
                       [style.color]="isFavorito(p.id) ? 'var(--color-rosa-fuerte)' : 'inherit'">
                    </i>
                  </button>
                  
                  <button class="btn-icon-solo carditem" (click)="addToCart(p.id)">
                    <i class="bi bi-cart-fill"></i>
                  </button>
                </div>
              }
            </div>
          </div>
        </div>
      </div>
    } @empty {
      <div class="col-12 text-center py-5 shadow-sm rounded border bg-white mt-3">
        <i class="bi bi-heartbreak-fill fs-1 text-muted d-block mb-3" style="color: #ccc !important;"></i>
        <h5 class="fw-bold text-secondary">Tu lista está vacía</h5>
        <p class="text-muted small">Aún no has guardado artículos en tus favoritos.</p>
        <button class="btn text-white px-4 mt-2" style="background-color: var(--color-rosa-fuerte);" routerLink="/productos">
          Explorar Tienda
        </button>
      </div>
    }
  </div>
</div>
